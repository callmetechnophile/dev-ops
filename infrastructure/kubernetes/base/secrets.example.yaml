apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: devops-intelligence
type: Opaque
stringData:
  # Cryptographic secret key for session and signature verification (min 32 bytes)
  SECRET_KEY: "REPLACE_WITH_CRYPTOGRAPHICALLY_SECURE_32_CHAR_SECRET"

  # PostgreSQL Credentials & Connection Strings
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "REPLACE_WITH_SECURE_POSTGRES_PASSWORD"
  POSTGRES_DB: "devops_intelligence"
  DATABASE_URL: "postgresql+asyncpg://postgres:REPLACE_WITH_SECURE_POSTGRES_PASSWORD@postgres-service:5432/devops_intelligence"
  SYNC_DATABASE_URL: "postgresql+psycopg2://postgres:REPLACE_WITH_SECURE_POSTGRES_PASSWORD@postgres-service:5432/devops_intelligence"

  # Redis Connection
  REDIS_URL: "redis://redis-service:6379/0"

  # GitHub Webhook and Integration Credentials
  GITHUB_WEBHOOK_SECRET: "REPLACE_WITH_GITHUB_WEBHOOK_SECRET"
  GITHUB_APP_ID: ""
  GITHUB_APP_INSTALLATION_ID: ""
  GITHUB_APP_PRIVATE_KEY: ""
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
