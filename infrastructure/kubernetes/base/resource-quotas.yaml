apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-quota
  namespace: devops-intelligence
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "30"
    persistentvolumeclaims: "5"
    services.loadbalancers: "1"
    services.nodeports: "0"
