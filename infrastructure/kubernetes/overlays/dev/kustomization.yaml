apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devops-intelligence

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Ingress
      name: platform-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: devops-intel.dev.local
  - target:
      kind: ConfigMap
      name: platform-config
    patch: |-
      - op: replace
        path: /data/ENVIRONMENT
        value: dev
      - op: replace
        path: /data/LOG_LEVEL
        value: DEBUG
