name: CI Foundation & Test Suite

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-test:
    name: Backend Tests & Database Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: devops_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install aiosqlite pytest pytest-asyncio httpx

      - name: Run Alembic migrations against PostgreSQL
        run: |
          cd backend
          alembic upgrade head
        env:
          SYNC_DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/devops_intelligence

      - name: Execute Pytest Suite
        run: |
          cd backend
          python -m pytest tests -v --durations=10
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/devops_intelligence
          SYNC_DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/devops_intelligence
          REDIS_URL: redis://localhost:6379/0
          GITHUB_WEBHOOK_SECRET: test-secret

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Next.js application
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
