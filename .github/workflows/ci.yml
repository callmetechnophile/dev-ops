name: CI/CD Production Hardened Pipeline

on:
  push:
    branches: [ "main", "develop", "master" ]
  pull_request:
    branches: [ "main", "develop", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-and-test:
    name: Backend Tests & Database Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: devops_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install aiosqlite pytest pytest-asyncio pytest-cov httpx flake8 black

      - name: Code Formatting & Linting Check
        run: |
          cd backend
          python -m flake8 app --config=.flake8
          python -m black --check --line-length=120 app

      - name: Run Alembic migrations against PostgreSQL
        run: |
          cd backend
          alembic upgrade head
        env:
          SYNC_DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/devops_intelligence

      - name: Execute Pytest Suite with Coverage
        run: |
          cd backend
          python -m pytest tests -v --durations=10 --cov=app --cov-report=term-missing
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/devops_intelligence
          SYNC_DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/devops_intelligence
          REDIS_URL: redis://localhost:6379/0
          GITHUB_WEBHOOK_SECRET: test-secret
          SECRET_KEY: test-secret-key-32-chars-minimum-prod-key

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint Next.js application
        run: |
          cd frontend
          npm run lint

      - name: Build Next.js standalone application
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_TELEMETRY_DISABLED: "1"

  manifest-validation:
    name: Kubernetes Manifest Validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      - name: Validate Base Manifests
        run: |
          kubectl kustomize infrastructure/kubernetes/base > /dev/null

      - name: Validate Dev Overlay
        run: |
          kubectl kustomize infrastructure/kubernetes/overlays/dev > /dev/null

      - name: Validate Staging Overlay
        run: |
          kubectl kustomize infrastructure/kubernetes/overlays/staging > /dev/null

      - name: Validate Production Overlay
        run: |
          kubectl kustomize infrastructure/kubernetes/overlays/production > /dev/null

  container-build-and-scan:
    name: Container Build & Security Scan
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend-build, manifest-validation]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: |
            devops-intelligence-backend:${{ github.sha }}
            devops-intelligence-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner on Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devops-intelligence-backend:${{ github.sha }}
          format: 'table'
          exit-code: '0' # Audit mode in CI, flag CRITICAL
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: |
            devops-intelligence-frontend:${{ github.sha }}
            devops-intelligence-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
